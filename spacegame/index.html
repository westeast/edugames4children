<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05090e">
<title>ORBIT · 漫游宇宙 · 感知地球 | 小小航天员</title>
<link rel="stylesheet" href="css/style.css?v=20261025">
</head>
<body>
  <div id="universe" aria-label="三维宇宙视图，拖动旋转，滚轮缩放"></div>
  <div id="labels" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- 加载屏 -->
  <div id="loading" role="status">
    <div class="load-mark">O<span>R</span>BIT</div>
    <p>正在展开宇宙</p>
    <div class="load-track"><i></i></div>
    <small>准备天体纹理与星际航线</small>
  </div>

  <!-- 错误屏 -->
  <div id="error" role="alert">
    <h1>星空暂时无法展开</h1>
    <p id="error-msg"></p>
    <button onclick="location.reload()">重新加载</button>
  </div>

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 38 38" fill="none" aria-hidden="true">
        <circle cx="19" cy="19" r="9" stroke="currentColor" stroke-width="1.4"/>
        <ellipse cx="19" cy="19" rx="20" ry="7" transform="rotate(-42 19 19)" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="29" cy="7" r="2.6" fill="currentColor"/>
      </svg>
      <span>ORBIT<small>漫游宇宙 · 感知地球</small></span>
    </div>
    <nav id="mode-nav" aria-label="模式">
      <button data-mode="explore" class="active">自由探索</button>
      <button data-mode="mission">任务模式</button>
      <button data-mode="tour">一键导览</button>
    </nav>
    <div class="topbar-right">
      <button class="icon-btn" id="library-btn" title="知识图鉴">📚</button>
      <button class="icon-btn" id="open-settings" title="设置">⚙</button>
      <button class="icon-btn" id="fullscreen-btn" onclick="toggleFullscreen()" title="全屏">⛶</button>
    </div>
  </header>

  <!-- 尺度导航（近地轨道 / 太阳系 / 银河系 / 星系图鉴）-->
  <nav class="scale-nav" aria-label="探索尺度">
    <button data-scale="earth" class="active">近地轨道</button>
    <button data-scale="solar">太阳系</button>
    <button data-scale="galaxy">银河系</button>
    <button data-scale="local">星系图鉴</button>
  </nav>

  <!-- 信息面板（左上）-->
  <main class="info-panel" id="info-panel">
    <div class="eyebrow"><span class="tiny-cross">+</span><span id="info-eyebrow">太阳系 / 类地行星</span></div>
    <p class="object-en" id="info-en">EARTH</p>
    <h1 id="info-name">地球<span class="object-index" id="info-index">03</span></h1>
    <p class="description" id="info-desc"></p>
    <div class="stats" id="info-stats"></div>
    <div class="context-actions" id="info-actions"></div>
  </main>

  <!-- 尺度导轨（右侧）-->
  <aside class="scale-rail" id="scale-rail" aria-label="缩放控制"></aside>
  <div class="zoom-controls">
    <button class="icon-btn" id="zoom-in" title="放大">+</button>
    <button class="icon-btn" id="zoom-out" title="缩小">−</button>
  </div>

  <!-- 视图字幕 -->
  <div class="view-caption">
    <i></i><span id="view-caption-scale">地球近轨</span><b> / </b><span id="view-caption-distance">距地表 20,000 km</span>
  </div>

  <!-- 底部：目的地坞 -->
  <footer class="dock">
    <div class="dock-head">
      <b id="dock-context">太阳系</b><span>DESTINATIONS</span>
    </div>
    <label class="dock-search">
      <span>查找天体</span>
      <input id="dock-search" type="search" placeholder="名称 / 编号" autocomplete="off" spellcheck="false">
    </label>
    <div class="dock-list" id="dock-list"></div>
  </footer>

  <!-- 图层开关 -->
  <div class="layers">
    <button class="layer-btn active" id="toggle-orbits"><span>轨道</span></button>
    <button class="layer-btn active" id="toggle-labels"><span>标记</span></button>
    <button class="layer-btn active" id="toggle-sat"><span>卫星</span></button>
  </div>

  <!-- 任务卡 -->
  <aside class="floating-card mission-card" id="mission-card"></aside>
  <!-- 导览卡 -->
  <aside class="floating-card tour-card" id="tour-card"></aside>

  <!-- 知识卡 / 图鉴 -->
  <div class="modal-card" id="knowledge-card"></div>
  <div class="modal-card" id="library"></div>

  <!-- 设置弹窗 -->
  <div class="settings" id="settings">
    <div class="settings-backdrop" id="settings-backdrop"></div>
    <div class="settings-panel">
      <div class="settings-head">
        <span>ORBIT · PREFERENCES</span>
        <button class="card-close" id="settings-close">×</button>
      </div>
      <h2>把宇宙，留在你的屏幕上。</h2>
      <fieldset>
        <legend>全局设置</legend>
        <label class="row">深空颜色<input id="space-color" type="color" value="#05090e"></label>
        <label class="row">深空星星<input id="stars-toggle" type="checkbox" checked></label>
      </fieldset>
      <fieldset>
        <legend>操作说明</legend>
        <p class="help">拖动旋转 · 滚轮 / 双指缩放 · 点击天体飞入 · 空格暂停 · H 回地球 · F 全屏</p>
      </fieldset>
      <div class="settings-actions">
        <button class="primary-btn" id="reset-btn">回到地球</button>
      </div>
      <p class="settings-note">本作品是宇宙可视化演示。天体大小、距离与轨道速度为展示示意，非真实比例。</p>
    </div>
  </div>

  <div id="toast" role="status"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="js/game.js?v=20261025"></script>
</body>
</html>
